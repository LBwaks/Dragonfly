[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonfly-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.17",
  "django-filter>=24.3,<26",
  "drf-spectacular>=0.28,<0.29",
  "psycopg[binary]>=3.2,<3.3",
  "django-environ>=0.12,<0.13",
  "django-cors-headers>=4.7,<5",
  "gunicorn>=23,<24",
  "whitenoise>=6.8,<7",
  "httpx>=0.28,<0.29",
  "numpy>=2.1,<3",
  "polars>=1.20,<2",
  "sentry-sdk[django]>=2.20,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-django>=4.9,<5", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*", "analytics*", "providers*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001", "DJ008"]
