components:
  schemas:
    EarningsEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_date:
          type: string
          format: date
        fiscal_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        fiscal_quarter:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        eps_estimate:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          nullable: true
        revenue_estimate:
          type: string
          format: decimal
          pattern: ^-?\d{0,22}(?:\.\d{0,2})?$
          nullable: true
        session:
          type: string
          maxLength: 20
        provider:
          type: string
          maxLength: 50
        raw_payload: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        instrument:
          type: integer
      required:
      - created_at
      - event_date
      - id
      - instrument
      - provider
    Instrument:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        symbol:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        exchange:
          type: string
          readOnly: true
        asset_type:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        sector:
          type: string
          readOnly: true
        industry:
          type: string
          readOnly: true
        provider_symbol:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        market_cap:
          type: string
          format: decimal
          pattern: ^-?\d{0,22}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset_type
      - created_at
      - currency
      - exchange
      - id
      - industry
      - is_active
      - market_cap
      - name
      - provider_symbol
      - sector
      - symbol
      - updated_at
    IpoEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        symbol:
          type: string
          maxLength: 20
        company_name:
          type: string
          maxLength: 255
        ipo_date:
          type: string
          format: date
        exchange:
          type: string
          maxLength: 100
        price:
          type: string
          format: decimal
