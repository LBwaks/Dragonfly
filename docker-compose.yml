services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dragonfly
      POSTGRES_USER: dragonfly
      POSTGRES_PASSWORD: dragonfly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragonfly -d dragonfly"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      # Next.js server components reach Django through the Compose service name.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},backend
      DATABASE_URL: postgresql://dragonfly:dragonfly@db:5432/dragonfly
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
